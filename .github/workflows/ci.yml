name: CI

on:
  push:
    branches: [headless-core]
  pull_request:
    branches: [headless-core]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Windows only tests on 3.11 to match the minimum matrix
          - os: windows-latest
            python-version: "3.12"
          # macOS only tests on 3.11
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

      - name: Type-check
        run: mypy src/arcadia

      - name: Run tests
        run: pytest

  build:
    name: Build and install wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build wheel
        run: python -m build --wheel

      - name: Create clean virtual environment
        run: python -m venv .wheel-test-venv

      - name: Install wheel in clean environment
        shell: bash
        run: |
          .wheel-test-venv/bin/python -m pip install --upgrade pip
          .wheel-test-venv/bin/python -m pip install dist/*.whl

      - name: Verify clean import
        shell: bash
        run: |
          .wheel-test-venv/bin/python -c "import arcadia; print(arcadia.__version__)"
