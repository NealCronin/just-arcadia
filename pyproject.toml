[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcadia-core"
version = "0.1.0"
description = "ARCADIA: headless research orchestration for fixed-sequence ML pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

authors = [
    { name = "ARCADIA" },
]
keywords = ["orchestration", "inference", "research", "pipeline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
node = []
llama = []
sam = []
priority-map = []
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/NealCronin/just-arcadia"
Documentation = "https://github.com/NealCronin/just-arcadia/tree/headless-core/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcadia = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["local://*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
